[project]
name = "agentcore-base"
version = "0.1.0"

requires-python = ">=3.10,<3.14"

dependencies = [
    "fastapi>=0.115.2,<1.0.0",
    "httpx[http2]>=0.27,<1.0.0",
    "aiofile>=3.9.0,<4.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "gunicorn>=22.0.0,<24.0.0",
    "langchain~=1.2.9",
    "langchain-classic==1.0.1",
    "langchain-community~=0.4.1",
    "langchain-core~=1.2.9",
    "langchainhub~=0.1.21",
    "loguru>=0.7.1,<1.0.0",
    "structlog>=25.4.0",
    "rich>=13.7.0,<14.0.0",
    "langchain-experimental>=0.4.1,<1.0.0",
    "sqlmodel==0.0.22",
    "pydantic>=2.11.1,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "cachetools>=5.5.0,<6.0.0",
    "platformdirs>=4.2.0,<5.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "orjson==3.10.15",
    "alembic>=1.13.0,<2.0.0",
    "passlib>=1.7.4,<2.0.0",
    "bcrypt==4.0.1",
    "pillow>=11.1.0,<12.0.0",
    "docstring-parser>=0.16,<1.0.0",
    "python-jose>=3.3.0,<4.0.0",
    "pandas==2.2.3",
    "duckdb>=1.0.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "jq>=1.7.0,<2.0.0; sys_platform != 'win32'",
    "nest-asyncio>=1.6.0,<2.0.0",
    "emoji>=2.12.0,<3.0.0",
    "cryptography>=42.0.5,<44.0.0",
    "asyncer>=0.0.5,<1.0.0",
    "pyperclip>=1.8.2,<2.0.0",
    "uncurl>=0.0.11,<1.0.0",
    "chardet>=5.2.0,<6.0.0",
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "opentelemetry-exporter-prometheus>=0.46b0,<1.0.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0.0",
    "aiofiles>=24.1.0,<25.0.0",
    "setuptools>=78.1.0,<79.0.0",
    "nanoid>=2.0.0,<3.0.0",
    "filelock>=3.15.4,<4.0.0",
    "grandalf>=0.8.0,<1.0.0",
    "clickhouse-connect==0.7.19",
    "fastapi-pagination>=0.13.1,<1.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf~=5.1.0",
    "validators>=0.34.0",
    "networkx>=3.4.2",
    "json-repair>=0.30.3",
    "mcp~=1.10.1",
    "greenlet>=3.1.1",
    "jsonquerylang>=1.1.1",
    "sqlalchemy>=2.0.38,<3.0.0",
    "scipy>=1.15.2",
    "langchain-chroma>=1.1.0",
    "psycopg[binary]",
    "pymupdf",
    "reportlab",
    "langgraph>=1.0.8",
    "langfuse>=3.0.0,<4.0.0",
    "trustcall",
    # Teams Bot Framework integration
    "botbuilder-core>=4.16.0,<5.0.0",
    "botbuilder-schema>=4.16.0,<5.0.0",
    "botbuilder-integration-aiohttp>=4.16.0,<5.0.0",
    "azure-identity>=1.16.0,<2.0.0",
    "msgraph-sdk>=1.0.0,<2.0.0",
]


[tool.hatch.build.targets.wheel]
packages = ["agentcore"]


[tool.pytest.ini_options]
minversion = "6.0"
#addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
log_cli = true
markers = ["async_test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
plugins = ["pydantic.mypy"]
follow_imports = "skip"
disable_error_code = ["type-var"]
namespace_packages = true
mypy_path = "agentcore"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
exclude = ["agentcore/alembic/versions"]
line-length = 120

[tool.ruff.lint]
flake8-annotations.mypy-init-return = true
flake8-bugbear.extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
]
flake8-type-checking.runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "typing.TypedDict", # Needed by fastapi
    "typing_extensions.TypedDict", # Needed by fastapi
]
pydocstyle.convention = "google"
select = ["ALL"]
ignore = [
    "C90", # McCabe complexity
    "CPY", # Missing copyright
    "COM812", # Messes with the formatter
    "ERA", # Eradicate commented-out code
    "FIX002", # Line contains TODO
    "ISC001", # Messes with the formatter
    "PERF203", # Rarely useful
    "PLR09", # Too many something (arg, statements, etc)
    "RUF012", # Pydantic models are currently not well detected
    "TD002", # Missing author in TODO
    "TD003", # Missing issue link in TODO
    "TRY301", # A bit too harsh (Abstract `raise` to an inner function)
    "PLC0415", # Inline imports
    # Rules that are TODOs
    "ANN", # Missing type annotations
    "D1", # Missing docstrings
    "SLF001", # Using private attributes outside of class
    "D10"
]

[tool.ruff.lint.per-file-ignores]
"agentcore/api/*" = [
    "TCH", # FastAPI needs to evaluate types at runtime
]
"agentcore/{components/tools/python_code_structured_tool.py,custom/code_parser/code_parser.py,utils/validate.py}" = [
    "S102", # Use of exec
]
"agentcore/services/cache/*" = [
    "S301", # Use of pickle
]

[tool.codeflash]
# All paths are relative to this pyproject.toml's directory.
module-root = "agentcore"
ignore-paths = ["agentcore/components/"]
formatter-cmds = ["ruff check --exit-zero --fix $file", "ruff format $file"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



postgresql = [
    "sqlalchemy[postgresql_psycopg2binary]>=2.0.38,<3.0.0",
    "sqlalchemy[postgresql_psycopg]>=2.0.38,<3.0.0",
]


[project.scripts]
agentcore-base = "agentcore.__main__:main"
