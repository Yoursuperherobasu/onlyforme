[project]
name = "agentcore"
version = "1.0.0"
description = "web application"
requires-python = ">=3.10,<3.13"

# Define your main dependencies here
dependencies = [
    "python-pptx== 1.0.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "PyPDF2==3.0.1",
    "pdf2image==1.17.0",
    "google-generativeai==0.8.6"
    "agentcore-base~=0.6.5",
    "beautifulsoup4==4.12.3",
    "google-search-results>=2.4.1,<3.0.0",
    "google-api-python-client==2.154.0",
    "networkx==3.4.2",
    "fake-useragent==1.5.1",
    "pyarrow>=19.0.1,<23.0.0",
    "types-cachetools>=5.5.0.20240820,<6.0.0",
    "pymongo==4.10.1",
    "supabase>=2.6.0,<3.0.0",
    "certifi>=2023.11.17,<2025.0.0",
    'fastavro==1.9.7; python_version < "3.13"',
    'fastavro>=1.9.8,<2.0.0; python_version >= "3.13"',
    "redis>=5.2.1,<6.0.0",
    "metaphor-python==0.1.23",
    'pywin32==307; sys_platform == "win32"',
    "langfuse>=3.0.0,<4.0.0",
    "metal_sdk==2.5.1",
    "MarkupSafe==3.0.2",
    "numexpr==2.10.2",
    "qianfan==0.3.5",
    "langchain==1.2.9",
    "langchain-classic==1.0.1",
    "chromadb>=1.0.0,<2.0.0",
    "Markdown==3.7",
    "upstash-vector==0.6.0",
    "GitPython==3.1.43",
    "kubernetes==31.0.0",
    "json_repair==0.30.3",
    "nltk==3.9.1",
    "lark==1.2.2",
    "jq==1.8.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "opensearch-py==2.8.0",
    "langchain-google-genai==4.2.0",
    "langchain-openai>=1.1.0,<2.0.0",
    "langchain-google-vertexai>=3.2.0,<4.0.0",
    "langchain-groq==1.1.2",
    "langchain-pinecone>=0.2.13,<1.0.0",
    "langchain-chroma>=1.1.0,<2.0.0",
    "langchain-unstructured==1.0.1",
    "langchain-community>=0.4.1,<1.0.0",
    "sqlalchemy[aiosqlite]>=2.0.38,<3.0.0",
    "aiofile>=3.9.0,<4.0.0",
    "sseclient-py==1.8.0",
    "openinference-instrumentation-langchain>=0.1.29,<0.1.52",
    "mcp>=1.10.1,<2.0.0",
    "uv==0.7.20",
    "scipy>=1.14.1,<1.16.2",
    "pydantic-ai>=0.0.19,<1.0.0",
    "langchain-graph-retriever==0.8.0",
    "graph-retriever==0.8.0",
    "cryptography>=43.0.1,<44.0.0",
    "aiosqlite==0.21.0",
    "fastparquet>=2024.11.0,<2025.0.0",
    "opencv-python>=4.11; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "toml>=0.10.2",
]

[tool.uv.sources]
agentcore-base = { workspace = true }
agentcore = { workspace = true }

[tool.uv.workspace]
members = [
    "src/backend/base",
    ".",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend/agentcore"]

[project.optional-dependencies]
docling = [
    "docling>=2.36.1,<3.0.0",
    "tesserocr>=2.8.0",
    "rapidocr-onnxruntime>=1.4.4",
    "ocrmac>=1.0.0; sys_platform == 'darwin'",
]

audio = [
    "webrtcvad>=2.0.10",
]

couchbase = [
    "couchbase>=4.2.1"
]
cassio = [
    "cassio>=0.1.7"
]
local = [
    "llama-cpp-python~=0.2.0",
    "sentence-transformers>=2.3.1",
    "ctransformers>=0.2.10"
]
clickhouse-connect = [
    "clickhouse-connect==0.7.19"
]

nv-ingest = [
    # NOTE: These must be removed in order to run `uv lock --upgrade` or `uv sync --upgrade`
    # due to incompatibility with <3.12 and how uv handles lockfile creation.
    # If upgrading, ensure `uv lock` and `uv sync` are run after upgrade with these,
    # and that afterward, the lockfile contains nv-ingest.
    "nv-ingest-api==25.6.2,<26.0.0 ; python_version >= '3.13'",
    "nv-ingest-client==25.6.3,<26.0.0 ; python_version >= '3.13'",
]

postgresql = [
    "sqlalchemy[postgresql_psycopg2binary]>=2.0.38,<3.0.0",
    "sqlalchemy[postgresql_psycopg]>=2.0.38,<3.0.0",
]

[tool.uv]
override-dependencies = [
    # temporary force a newer python-pptx
    "python-pptx>=1.0.2"
]

[tool.codespell]
skip = '.git,*.pdf,*.svg,*.pdf,*.yaml,*.ipynb,poetry.lock,*.min.js,*.css,package-lock.json,*.trig.,**/node_modules/**,./stuff/*,*.csv'
# Ignore latin etc
ignore-regex = '.*(Stati Uniti|Tense=Pres).*'


[tool.pytest.ini_options]
timeout = 150
timeout_method = "signal"
minversion = "6.0"
testpaths = ["src/backend/tests"]
console_output_style = "progress"
filterwarnings = ["ignore::DeprecationWarning", "ignore::ResourceWarning"]
log_cli = true
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "async_test",
    "api_key_required",
    "no_blockbuster",
    "benchmark",
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:benchmark"

[tool.coverage.run]
command_line = """
    -m pytest --ignore=tests/integration
    --cov --cov-report=term --cov-report=html
    --instafail -ra -n auto -m "not api_key_required"
"""
source = ["src/backend/base/agentcore/"]
omit = ["*/alembic/*", "tests/*", "*/__init__.py"]


[tool.coverage.report]
sort = "Stmts"
skip_empty = true
show_missing = false
ignore_errors = true


[tool.coverage.html]
directory = "coverage"


[tool.ruff]
exclude = ["src/backend/base/agentcore/alembic/*", "src/frontend/tests/assets/*"]
line-length = 120

[tool.ruff.lint]
pydocstyle.convention = "google"
select = ["ALL"]
ignore = [
    "C90", # McCabe complexity
    "CPY", # Missing copyright
    "COM812", # Messes with the formatter
    "ERA", # Eradicate commented-out code
    "FIX002", # Line contains TODO
    "ISC001", # Messes with the formatter
    "PERF203", # Rarely useful
    "PLR09", # Too many something (arg, statements, etc)
    "RUF012", # Pydantic models are currently not well detected
    "TD002", # Missing author in TODO
    "TD003", # Missing issue link in TODO
    "TRY301", # A bit too harsh (Abstract `raise` to an inner function)
    "PLC0415", # Inline imports
    "D10", # Missing docstrings
    "PLW1641", # Object does not implement `__hash__` method (mutable objects shouldn't be hashable)
    # Rules that are TODOs
    "ANN"
]

# Preview rules that are not yet activated
external = ["RUF027"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D1", "INP", "T201"]
"src/backend/base/agentcore/alembic/versions/*" = ["INP001", "D415", "PGH003"]
"src/backend/tests/*" = [
    "D1",
    "PLR2004",
    "S101",
    "SLF001",
    "BLE001",  # allow broad-exception catching in tests
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = [ "io", "logging", "socket"]

[tool.mypy]
plugins = ["pydantic.mypy"]
follow_imports = "skip"
disable_error_code = ["type-var"]
namespace_packages = true
mypy_path = "agentcore"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

